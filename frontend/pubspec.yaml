name: smartcar
description: University carpooling for the Universite Ibn Zohr community.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  firebase_auth: ^5.3.3
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  google_maps_flutter: ^2.9.0
  google_mlkit_text_recognition: ^0.14.0
  image_picker: ^1.1.2
  socket_io_client: ^3.0.2
  google_fonts: ^9.0.0
  google_sign_in: ^7.2.0
  shared_preferences: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
    - assets/images/
    - assets/images/illustrations/
    - assets/icons/